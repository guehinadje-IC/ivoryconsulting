<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page introuvable (404) | Ivory Consulting</title>
  <meta name="description" content="Cette page n'existe pas ou a été déplacée. Retrouvez les ateliers cognitifs et l'accompagnement QVCT d'Ivory Consulting en Guadeloupe."/>
  <meta name="robots" content="noindex, follow"/>
  <meta name="theme-color" content="#0B1020"/>
  <link rel="icon" type="image/png" href="/logo-v2-vierge.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{ --navy:#0B1020; --gold:#C6A44B; --cream:#F7F5F0; --muted:#6B7280; }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'Inter',system-ui,sans-serif;
      background:radial-gradient(circle at 20% 20%, #16203a 0%, var(--navy) 60%);
      color:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:40px 24px;text-align:center;
    }
    .wrap{max-width:640px;}
    .logo{width:64px;height:64px;object-fit:contain;margin-bottom:28px;}
    .code{font-family:'Playfair Display',serif;font-size:clamp(4rem,14vw,7rem);line-height:1;color:var(--gold);}
    h1{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,4vw,2.1rem);margin:12px 0 18px;font-weight:600;}
    p{color:#C9CEDA;font-size:1.02rem;line-height:1.65;margin-bottom:32px;}
    .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:36px;}
    .btn{
      display:inline-block;padding:14px 26px;border-radius:999px;text-decoration:none;
      font-weight:600;font-size:.95rem;transition:transform .2s ease,opacity .2s ease;
    }
    .btn:hover{transform:translateY(-2px);}
    .btn-gold{background:var(--gold);color:var(--navy);}
    .btn-ghost{border:1px solid rgba(198,164,75,.55);color:var(--gold);}
    .links{font-size:.9rem;color:var(--muted);}
    .links a{color:#C9CEDA;text-decoration:none;margin:0 10px;border-bottom:1px solid rgba(255,255,255,.15);}
    .links a:hover{color:var(--gold);}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/logo-v2-vierge.png" alt="Ivory Consulting"/>
    <div class="code">404</div>
    <h1>Cette page a changé d'adresse</h1>
    <p>
      Le lien que vous avez suivi ne mène plus nulle part, le site a été refondu en 2026.
      Voici les deux endroits les plus utiles pour repartir.
    </p>
    <div class="actions">
      <a class="btn btn-gold" href="/">Retour à l'accueil</a>
      <a class="btn btn-ghost" href="/guide.html">Recevoir le guide gratuit</a>
    </div>
    <p class="links">
      <a href="https://calendly.com/guehinadje-ivoryconsulting/audit">Réserver un audit gratuit</a>
      <a href="mailto:guehinadje@ivoryconsulting.fr">M'écrire</a>
    </p>
  </main>
</body>
</html>
